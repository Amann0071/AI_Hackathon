<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-base-url" content="">
    <title>Government Scheme-Matching Assistant</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; background: #f4f7fb; color: #172033; }
      main { max-width: 760px; margin: 40px auto; padding: 0 20px; }
      h1 { margin-bottom: 8px; }
      #chat { height: 480px; overflow-y: auto; border: 1px solid #dce3ed; border-radius: 12px; background: white; padding: 18px; }
      .message { max-width: 78%; margin: 10px 0; padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; }
      .assistant { background: #edf4ff; border: 1px solid #d8e6ff; }
      .user { margin-left: auto; background: #172033; color: white; }
      .message.results { max-width: 100%; }
      .results h3 { margin: 14px 0 8px; }
      .results table { width: 100%; border-collapse: collapse; background: white; font-size: 14px; }
      .results th, .results td { border: 1px solid #dce3ed; padding: 9px; text-align: left; vertical-align: top; }
      .results th { background: #e8effb; }
      .results a { color: #2457d6; }
      .table-wrap { overflow-x: auto; margin-bottom: 14px; }
      form { display: flex; gap: 10px; margin-top: 14px; }
      input { flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font-size: 16px; }
      button { border: 0; border-radius: 8px; background: #2457d6; color: white; padding: 12px 18px; cursor: pointer; }
      button:disabled { opacity: .65; cursor: wait; }
    </style>
  </head>
  <body>
    <main>
      <h1>Government Scheme-Matching Assistant</h1>
      <p>Ask in English or Hindi.</p>
      <div id="chat" aria-live="polite"></div>
      <form id="form">
        <input id="message" placeholder="Type your message..." autocomplete="off" maxlength="1600" required>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("message");
      const send = document.getElementById("send");
      const isGithubPages = window.location.hostname === "amann0071.github.io";
      const GEMINI_API_URL = "https://ai-hackathon-silk.vercel.app/api/gemini";
      const apiBaseUrl = document.querySelector('meta[name="api-base-url"]').content.trim().replace(/\/$/, "");
      let sessionId = null;
      let geminiHistory = [];

      function buildGeminiPrompt() {
        const instructions = "You are a helpful Indian government-scheme assistant. Ask one question at a time to learn age, occupation, social category, gender, and annual family income. Then list possible eligible schemes and near-matches, state unmet criteria, avoid inventing eligibility rules, and advise checking official portals.";
        let turns = geminiHistory.slice(-8);
        let conversation = turns.map((turn) => `${turn.role}: ${turn.content}`).join("\n");
        while (instructions.length + conversation.length + 2 > 2000 && turns.length > 1) {
          turns = turns.slice(1);
          conversation = turns.map((turn) => `${turn.role}: ${turn.content}`).join("\n");
        }
        const prompt = `${instructions}\n\n${conversation}`;
        if (prompt.length > 2000) throw new Error("Message is too long. Please shorten it.");
        return prompt;
      }

      async function sendToGemini() {
        const response = await fetch(GEMINI_API_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({prompt: buildGeminiPrompt()})
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Chat request failed (HTTP ${response.status})`);
        if (typeof data.text !== "string" || !data.text.trim()) {
          throw new Error("The chat service returned an empty response.");
        }
        return data.text;
      }

      function addTable(parent, title, columns, rows, getCells) {
        if (!rows.length) return;
        const heading = document.createElement("h3");
        heading.textContent = title;
        parent.appendChild(heading);

        const wrapper = document.createElement("div");
        wrapper.className = "table-wrap";
        const table = document.createElement("table");
        const header = document.createElement("thead");
        const headerRow = document.createElement("tr");
        for (const column of columns) {
          const cell = document.createElement("th");
          cell.scope = "col";
          cell.textContent = column;
          headerRow.appendChild(cell);
        }
        header.appendChild(headerRow);
        table.appendChild(header);

        const body = document.createElement("tbody");
        for (const row of rows) {
          const tableRow = document.createElement("tr");
          for (const value of getCells(row)) {
            const cell = document.createElement("td");
            if (value && typeof value === "object") {
              const link = document.createElement("a");
              link.href = value.href;
              link.textContent = value.label;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              cell.appendChild(link);
            } else {
              cell.textContent = value || "";
            }
            tableRow.appendChild(cell);
          }
          body.appendChild(tableRow);
        }
        table.appendChild(body);
        wrapper.appendChild(table);
        parent.appendChild(wrapper);
      }

      function addMessage(role, text, results) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        const eligible = results && results.exact_matches;
        const nearMatches = results && results.near_misses;
        if (role === "assistant" && (eligible?.length || nearMatches?.length)) {
          node.classList.add("results");
          const intro = document.createElement("p");
          intro.textContent = "Here are the schemes matched against the details you provided:";
          node.appendChild(intro);
          addTable(node, "Eligible schemes", ["Scheme", "Category", "Benefit", "Official details"], eligible ? eligible.slice(0, 5) : [], (scheme) => [
            scheme.name,
            scheme.category,
            scheme.benefit_summary,
            {label: "View official site", href: scheme.official_url}
          ]);
          addTable(node, "Potential near-matches", ["Scheme", "Criteria to meet", "Official details"], nearMatches ? nearMatches.slice(0, 5) : [], (scheme) => [
            scheme.name,
            scheme.eligibility_guidance || scheme.failed_reasons?.join(" ") || "Check the scheme requirements.",
            {label: "View official site", href: scheme.official_url}
          ]);
          const note = document.createElement("p");
          note.textContent = "Please verify current eligibility and application details on the official scheme portal.";
          node.appendChild(note);
        } else {
          node.textContent = text;
        }
        chat.appendChild(node);
        chat.scrollTop = chat.scrollHeight;
      }

      async function reset() {
        if (isGithubPages) {
          const greeting = "Namaste! I can help you discover Indian government schemes. What is your age and what do you currently do?";
          geminiHistory = [{role: "assistant", content: greeting}];
          addMessage("assistant", greeting);
          return;
        }
        const response = await fetch(`${apiBaseUrl}/reset`, { method: "POST", headers: {"Content-Type":"application/json"}, body:"{}" });
        if (!response.ok) throw new Error(`Could not start chat (HTTP ${response.status})`);
        const data = await response.json();
        sessionId = data.session_id;
        addMessage("assistant", data.reply, data.results);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        addMessage("user", text);
        input.value = "";
        send.disabled = true;
        try {
          if (isGithubPages) {
            geminiHistory.push({role: "user", content: text});
            const reply = await sendToGemini();
            geminiHistory.push({role: "assistant", content: reply});
            addMessage("assistant", reply);
          } else {
            const response = await fetch(`${apiBaseUrl}/chat`, {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({session_id: sessionId, message: text})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Chat request failed");
            sessionId = data.session_id;
            addMessage("assistant", data.reply, data.results);
          }
        } catch (error) {
          addMessage("assistant", `Error: ${error.message}`);
        } finally {
          send.disabled = false;
          input.focus();
        }
      });

      reset().catch((error) => addMessage("assistant", `Error: ${error.message}`));
    </script>
  </body>
</html>
